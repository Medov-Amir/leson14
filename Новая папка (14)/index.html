    <script>


        //------------------------Задание 1-----------------------
        let obj = {
            price1: 100,
            price2: 150,
            price3: 200,
            price4: 100,
            price5: 150,
        }

        function sumObjectValues(obj) {
            const values = Object.values(obj);
            let total = 0;

            values.map(value => {
                total += value;
            });

            return total;
        }
        const result = sumObjectValues(obj);
        console.log(result);
